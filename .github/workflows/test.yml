name: Build and Test

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    # if you fork this repo, you should change this to ubuntu-latest
    # you should also disable ipv6 tests, and the android tests
    # (the self-hosted tests have ipv6 on the host and a phone attached to the runner)
    runs-on: [self-hosted, sair-enabled]
    env:
      HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25.0.4+101.0.LTS'
          distribution: 'temurin'
#          cache: gradle # https://github.com/actions/setup-java/issues/683
      - name: Display host of runner
        run: echo $HOST_NAME
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Load secrets from 1Password
        if: env.HAS_OP_TOKEN == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WIFI_SSID: op://Infrastructure/Wi-Fi/username
          WIFI_PASSWORD: op://Infrastructure/Wi-Fi/password
          SAIR_API_KEY: op://Infrastructure/sair-user-api-key/credential

      - name: Build and Publish the Common Library to the local Maven repository
        run: ./gradlew :icmp-common:publishToMavenLocal
      - name: Build and Publish the Android and Linux Libraries to the local Maven repository
        run: ./gradlew :icmp-android:publishToMavenLocal :icmp-linux:publishToMavenLocal
      - name: Build with Gradle
        run: ./gradlew assemble          # we don't use build because that will run the tests, we want that separate
      - name: JVM Unit tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: ./gradlew check

      # Only the two bash tools are needed here; the proxy runs on the host.
      - name: Fetch SAIR tools
        if: env.HAS_OP_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: compscidr/sair
          ref: v0.1.3
          sparse-checkout: tools
          path: sair
          persist-credentials: false

      # sair-acquire (v0.0.16+) appends its exports to $GITHUB_ENV itself.
      - name: Acquire device lock
        if: env.HAS_OP_TOKEN == 'true'
        run: |
          sair/tools/sair-acquire --count 1 > /dev/null

      # A network suggestion, not a saved network: `cmd wifi connect-network`
      # is blocked for the shell uid on Android 14 (SM-A065M) while
      # add-suggestion is allowed on both phones, and remove-suggestion at the
      # end drops the connection without leaving anything in the phone's saved
      # networks. start-scan makes the phone pick the suggestion up now rather
      # than on its next periodic scan. `adb shell` exits 0 even when the
      # remote command throws, so assert connectivity instead of trusting the
      # calls: one ping to a hostname covers DNS, ICMP and routing, which is
      # what the instrumented tests need. Deliberately not jasonernst.com -
      # pingDnsTimeout wants a cold DNS cache for that host.
      - name: Connect phone to Wi-Fi
        if: env.HAS_OP_TOKEN == 'true'
        run: |
          adb shell cmd wifi add-suggestion "$WIFI_SSID" wpa2 "$WIFI_PASSWORD"
          adb shell cmd wifi start-scan
          for _ in $(seq 30); do
            adb shell ping -c1 -W2 google.com >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::$ANDROID_SERIAL has no network - Wi-Fi setup failed"
          adb shell cmd wifi status
          exit 1
      - name: Clear Wi-Fi password from environment
        if: env.HAS_OP_TOKEN == 'true'
        run: echo "WIFI_PASSWORD=" >> "$GITHUB_ENV"

      - name: Uninstall stale APKs
        if: env.HAS_OP_TOKEN == 'true'
        run: |
          adb devices | grep -w device | awk '{print $1}' | while read serial; do
            adb -s "$serial" uninstall com.jasonernst.icmp_lib 2>&1 | grep -v "DELETE_FAILED_INTERNAL_ERROR" || true
            adb -s "$serial" uninstall com.jasonernst.icmp_lib.test 2>&1 | grep -v "DELETE_FAILED_INTERNAL_ERROR" || true
          done

      - name: Android Instrumented tests # disable if you don't have a phone attached to the runner
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: ./gradlew connectedCheck

      - name: Upload ICMP Common Unit Tests Report to CodeCov
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: commonunittests
          files: ./icmp-common/build/reports/jacoco/test/jacocoTestReport.xml
      - name: Upload ICMP Linux Unit Tests Report to CodeCov
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: linuxunittests
          files: ./icmp-linux/build/reports/jacoco/test/jacocoTestReport.xml
      - name: Upload Instrumented Tests Report to CodeCov
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: instrumentedtests
          files: ./icmp-android/build/reports/coverage/androidTest/debug/connected/report.xml
      - name: Disconnect phone from Wi-Fi
        if: always() && env.SAIR_LOCK_ID != ''
        run: |
          if [ -n "$WIFI_SSID" ]; then
            adb shell cmd wifi remove-suggestion "$WIFI_SSID"
          else
            echo "WIFI_SSID is not set; skipping Wi-Fi disconnect."
          fi
      - name: Release device lock
        if: always() && env.SAIR_LOCK_ID != ''
        run: sair/tools/sair-release --status ${{ job.status }}
